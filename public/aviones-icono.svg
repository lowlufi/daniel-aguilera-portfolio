  <rect x="4" y="27" width="6" height="1" fill="#9ad8ff"/>
  <rect x="18" y="29" width="8" height="1" fill="#9ad8ff"/>
  <rect x="22" y="19" width="5" height="5" fill="#ffd84a"/>
  <rect x="21" y="20" width="7" height="3" fill="#ffd84a"/>
